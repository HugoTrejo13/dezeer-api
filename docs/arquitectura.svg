<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232F3E"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C7135F"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6B7B"/>
    </marker>
    <style>
      .t { font-size: 17px; font-weight: 700; fill: #232F3E; }
      .s { font-size: 13px; fill: #4B5563; }
      .l { font-size: 12.5px; fill: #232F3E; }
      .lp { font-size: 12.5px; fill: #C7135F; }
      .lg { font-size: 12.5px; fill: #5A6B7B; }
      .box { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#FFFFFF"/>

  <!-- Nube de AWS -->
  <rect x="300" y="60" width="600" height="620" rx="14" fill="#F7F8FA" stroke="#232F3E" stroke-width="1.5"/>
  <text x="324" y="92" class="t">AWS · us-east-2 (Ohio)</text>
  <text x="324" y="112" class="s">Todo se crea con Terraform (terraform/main.tf y monitoreo.tf)</text>

  <!-- Navegador -->
  <rect x="40" y="180" width="200" height="90" rx="10" class="box"/>
  <rect x="40" y="180" width="8" height="90" rx="4" fill="#232F3E"/>
  <text x="62" y="216" class="t">Navegador</text>
  <text x="62" y="240" class="s">index.html: Tailwind + Alpine</text>
  <text x="62" y="258" class="s">playlists en localStorage</text>

  <!-- Function URL -->
  <rect x="340" y="180" width="200" height="90" rx="10" class="box"/>
  <rect x="340" y="180" width="8" height="90" rx="4" fill="#ED7100"/>
  <text x="362" y="216" class="t">Function URL</text>
  <text x="362" y="240" class="s">link público HTTPS</text>
  <text x="362" y="258" class="s">sin login (auth NONE)</text>

  <!-- Lambda -->
  <rect x="600" y="165" width="260" height="120" rx="10" class="box"/>
  <rect x="600" y="165" width="8" height="120" rx="4" fill="#ED7100"/>
  <text x="622" y="200" class="t">AWS Lambda · onda</text>
  <text x="622" y="224" class="s">main.py: FastAPI + Mangum</text>
  <text x="622" y="244" class="s">Python 3.14 · 256 MB · 15 s</text>
  <text x="622" y="264" class="s">caché 5 min + 2 reintentos</text>

  <!-- Deezer -->
  <rect x="960" y="180" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="982" y="216" class="t">API de Deezer</text>
  <text x="982" y="240" class="s">api.deezer.com</text>
  <text x="982" y="258" class="s">pública, sin token</text>

  <!-- Rol IAM -->
  <rect x="340" y="320" width="200" height="80" rx="10" class="box"/>
  <rect x="340" y="320" width="8" height="80" rx="4" fill="#DD344C"/>
  <text x="362" y="352" class="t">Rol IAM</text>
  <text x="362" y="376" class="s">solo puede escribir logs</text>

  <!-- CloudWatch -->
  <rect x="600" y="440" width="260" height="90" rx="10" class="box"/>
  <rect x="600" y="440" width="8" height="90" rx="4" fill="#E7157B"/>
  <text x="622" y="476" class="t">CloudWatch</text>
  <text x="622" y="500" class="s">logs y métricas de Lambda</text>
  <text x="622" y="518" class="s">métrica Url5xxCount</text>

  <!-- Alarma -->
  <rect x="340" y="440" width="200" height="90" rx="10" class="box"/>
  <rect x="340" y="440" width="8" height="90" rx="4" fill="#E7157B"/>
  <text x="362" y="476" class="t">Alarma</text>
  <text x="362" y="500" class="s">onda-errores</text>
  <text x="362" y="518" class="s">≥ 5 errores en 5 min</text>

  <!-- SNS -->
  <rect x="340" y="570" width="200" height="80" rx="10" class="box"/>
  <rect x="340" y="570" width="8" height="80" rx="4" fill="#E7157B"/>
  <text x="362" y="602" class="t">SNS</text>
  <text x="362" y="626" class="s">tema onda-alertas</text>

  <!-- Correo -->
  <rect x="40" y="570" width="200" height="80" rx="10" class="box"/>
  <rect x="40" y="570" width="8" height="80" rx="4" fill="#232F3E"/>
  <text x="62" y="602" class="t">Correo</text>
  <text x="62" y="626" class="s">avisos ALARM y OK</text>

  <!-- Tu compu -->
  <rect x="40" y="330" width="200" height="110" rx="10" class="box"/>
  <rect x="40" y="330" width="8" height="110" rx="4" fill="#5A6B7B"/>
  <text x="62" y="364" class="t">Tu compu</text>
  <text x="62" y="388" class="s">terraform/deploy.sh</text>
  <text x="62" y="406" class="s">empaqueta el zip y</text>
  <text x="62" y="424" class="s">corre terraform apply</text>

  <!-- Flujo de datos -->
  <line x1="240" y1="225" x2="338" y2="225" stroke="#232F3E" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="294" y="214" class="l" text-anchor="end">1. HTTPS</text>
  <line x1="540" y1="225" x2="598" y2="225" stroke="#232F3E" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="547" y="214" class="l">2. invoca</text>
  <line x1="860" y1="225" x2="958" y2="225" stroke="#232F3E" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="906" y="214" class="l">3. GET</text>
  <path d="M 1140 270 L 1140 300 Q 1140 310 1130 310 L 160 310 Q 140 310 140 290 L 140 272" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="930" y="294" class="lg">audio 30 s: directo al navegador</text>

  <!-- Rol -->
  <line x1="540" y1="360" x2="640" y2="287" stroke="#DD344C" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="560" y="380" class="l" style="fill:#DD344C">permisos</text>

  <!-- Monitoreo -->
  <line x1="730" y1="285" x2="730" y2="438" stroke="#C7135F" stroke-width="2" marker-end="url(#p)"/>
  <text x="740" y="370" class="lp">logs y métricas</text>
  <line x1="600" y1="485" x2="542" y2="485" stroke="#C7135F" stroke-width="2" marker-end="url(#p)"/>
  <text x="548" y="474" class="lp">evalúa</text>
  <line x1="440" y1="530" x2="440" y2="568" stroke="#C7135F" stroke-width="2" marker-end="url(#p)"/>
  <text x="450" y="554" class="lp">publica</text>
  <line x1="340" y1="610" x2="242" y2="610" stroke="#C7135F" stroke-width="2" marker-end="url(#p)"/>
  <text x="252" y="600" class="lp">envía</text>

  <!-- Despliegue -->
  <line x1="240" y1="385" x2="298" y2="385" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="246" y="374" class="lg">crea</text>

  <!-- Leyenda -->
  <line x1="940" y1="560" x2="980" y2="560" stroke="#232F3E" stroke-width="2"/>
  <text x="990" y="564" class="l">flujo de datos</text>
  <line x1="940" y1="590" x2="980" y2="590" stroke="#C7135F" stroke-width="2"/>
  <text x="990" y="594" class="l">monitoreo y alertas</text>
  <line x1="940" y1="620" x2="980" y2="620" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="990" y="624" class="l">despliegue con Terraform</text>
</svg>
