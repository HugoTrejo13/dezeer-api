<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onda</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2314162B'/%3E%3Cpath d='M3 12c3-7 6-7 9 0s6 7 9 0' fill='none' stroke='%235CE1D6' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.14.9/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-tinta: #14162B;
      --color-noche: #1E2140;
      --color-niebla: #E9E8F5;
      --color-bruma: #B9BAD6;
      --color-marea: #5CE1D6;
      --font-sans: "Hanken Grotesk", system-ui, sans-serif;
      --font-display: "Unbounded", system-ui, sans-serif;
    }
    @layer components {
      .ic { @apply size-5 fill-current; }
      .ib { @apply grid size-9 shrink-0 cursor-pointer place-items-center rounded-full text-bruma hover:bg-white/10 hover:text-niebla; }
      .nav { @apply flex shrink-0 items-center gap-3 truncate rounded-lg px-3 py-2 text-bruma hover:bg-white/5 hover:text-niebla; }
      .aura { @apply fixed -inset-[15%] -z-10 bg-cover bg-center; filter: blur(90px) saturate(1.5) brightness(.55); opacity: .4; animation: aura 1.6s ease-out; }
    }
    @keyframes aura { from { opacity: 0; } }
    :focus-visible { outline: 2px solid var(--color-marea); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .aura { animation: none; } }
    [x-cloak] { display: none !important; }
  </style>
</head>

<body x-data="app()" x-init="route()" @hashchange.window="route()" @keydown.escape.window="menu = null"
  @keydown.space.window="if (current && !$event.target.closest('input,button,a')) { $event.preventDefault(); toggle() }"
  class="grid h-dvh grid-rows-[auto_1fr_auto] overflow-hidden bg-tinta font-sans text-niebla antialiased md:grid-cols-[16rem_1fr] md:grid-rows-[1fr_auto]">

  <template x-for="cover in auras" :key="cover">
    <div class="aura" :style="`background-image: url('${cover}')`"></div>
  </template>

  <!-- Barra lateral -->
  <aside class="flex min-w-0 flex-col gap-4 bg-tinta/50 p-4 md:overflow-y-auto">
    <div class="flex items-center gap-4 md:flex-col md:items-stretch">
      <a href="#/" class="font-display text-2xl font-bold text-marea">Onda</a>
      <input type="search" x-model="query" @input.debounce.350ms="search()" placeholder="Buscar canciones o artistas"
        aria-label="Buscar canciones o artistas"
        class="w-full min-w-0 rounded-full bg-white/10 px-4 py-2 text-sm placeholder:text-bruma focus:bg-white/15">
    </div>
    <nav class="flex gap-1 overflow-x-auto md:flex-col md:overflow-visible">
      <a href="#/" class="nav" :class="view === '' && 'bg-white/10 text-niebla'">
        <svg class="ic" viewBox="0 0 24 24"><path :d="ic.home" /></svg>Inicio
      </a>
      <template x-for="l in lists" :key="l.id">
        <a :href="`#/list/${l.id}`" class="nav" :class="listId === l.id && 'bg-white/10 text-niebla'">
          <svg class="ic shrink-0" viewBox="0 0 24 24"><path :d="l.id === 'fav' ? ic.heart : ic.list" /></svg>
          <span class="truncate" x-text="l.name"></span>
        </a>
      </template>
      <button @click="createList()" class="nav cursor-pointer text-left">
        <svg class="ic" viewBox="0 0 24 24"><path :d="ic.plus" /></svg>Crear lista
      </button>
    </nav>
  </aside>

  <!-- Contenido: todas las vistas usan esta misma plantilla -->
  <main x-ref="main" @scroll="menu = null" class="min-w-0 overflow-y-auto p-4 md:p-8" :class="loading && 'opacity-50'">
    <header class="mb-8 flex flex-wrap items-end gap-6">
      <img x-show="page.cover" :src="page.cover" alt="" class="size-32 object-cover md:size-48"
        :class="view === 'artist' ? 'rounded-full' : 'rounded-lg'">
      <div class="min-w-0 flex-1 basis-64">
        <template x-for="l in (list && list.id !== 'fav' ? [list] : [])" :key="l.id">
          <input x-model="l.name" @blur="l.name = l.name.trim() || 'Sin nombre'" aria-label="Nombre de la lista"
            class="w-full rounded-lg bg-transparent font-display text-3xl font-bold md:text-5xl">
        </template>
        <h1 x-show="!list || list.id === 'fav'" x-text="page.title"
          class="font-display text-3xl font-bold break-words md:text-5xl"></h1>
        <a x-show="page.subtitle" :href="page.artist_id ? `#/artist/${page.artist_id}` : null" x-text="page.subtitle"
          class="mt-3 block text-bruma" :class="page.artist_id && 'hover:text-niebla hover:underline'"></a>
        <div class="mt-4 flex flex-wrap items-center gap-3">
          <button x-show="page.tracks?.length && view !== 'search'" @click="playFrom(page.tracks, 0)"
            class="flex cursor-pointer items-center gap-2 rounded-full bg-marea py-2 pl-3 pr-5 font-semibold text-tinta hover:brightness-110">
            <svg class="ic" viewBox="0 0 24 24"><path :d="ic.play" /></svg>Reproducir
          </button>
          <button x-show="list && list.id !== 'fav' && !confirming" @click="confirming = true"
            class="cursor-pointer rounded-full px-4 py-2 text-sm text-bruma hover:bg-white/10 hover:text-niebla">Eliminar lista</button>
          <template x-if="confirming">
            <div class="flex items-center gap-2 text-sm">
              <span>¿Eliminar esta lista?</span>
              <button @click="deleteList()" class="cursor-pointer rounded-full bg-white/15 px-4 py-2 font-semibold hover:bg-white/25">Eliminar</button>
              <button @click="confirming = false" class="cursor-pointer rounded-full px-4 py-2 text-bruma hover:text-niebla">Cancelar</button>
            </div>
          </template>
        </div>
      </div>
    </header>

    <div x-show="error" x-cloak class="mb-6 flex flex-wrap items-center gap-4 rounded-lg bg-white/10 p-4">
      <span x-text="error"></span>
      <button @click="route()" class="cursor-pointer rounded-full bg-white/15 px-4 py-1.5 font-semibold hover:bg-white/25">Reintentar</button>
    </div>
    <p x-show="!loading && !error && !page.tracks?.length && !rails.length" x-cloak class="text-bruma"
      x-text="list ? 'Esta lista está vacía. Busca una canción y agrégala con el botón +.' : 'Sin resultados. Prueba con otro nombre o artista.'"></p>

    <div class="flex flex-col gap-10">
      <section x-show="page.tracks?.length" :class="view === 'search' ? 'order-1' : '-order-1'">
        <h2 x-show="view === ''" class="mb-3 font-display text-lg font-medium">Canciones del momento</h2>
        <template x-for="(t, i) in shownTracks" :key="t.id">
          <div @click="clickTrack(i)"
            class="group grid cursor-pointer grid-cols-[2.25rem_1fr_auto] items-center gap-3 rounded-lg px-2 py-1.5 hover:bg-white/5 md:grid-cols-[2.25rem_2fr_1fr_auto]">
            <button @click.stop="clickTrack(i)" class="ib group-hover:text-marea"
              :aria-label="(isCurrent(t) && playing ? 'Pausar ' : 'Reproducir ') + t.title">
              <svg class="ic" viewBox="0 0 24 24"><path :d="isCurrent(t) && playing ? ic.pause : ic.play" /></svg>
            </button>
            <div class="flex min-w-0 items-center gap-3">
              <img :src="t.cover" alt="" loading="lazy" class="size-11 rounded">
              <div class="min-w-0">
                <p class="truncate font-medium" :class="isCurrent(t) && 'text-marea'" x-text="t.title"></p>
                <a :href="`#/artist/${t.artist_id}`" @click.stop class="block truncate text-sm text-bruma hover:text-niebla hover:underline" x-text="t.artist"></a>
              </div>
            </div>
            <a :href="`#/album/${t.album_id}`" @click.stop class="hidden truncate text-sm text-bruma hover:text-niebla hover:underline md:block" x-text="t.album"></a>
            <div class="flex items-center">
              <button @click.stop="toggleIn(lists[0], t)" class="ib" :class="has(lists[0], t) && 'text-marea'"
                :aria-label="(has(lists[0], t) ? 'Quitar de Favoritas: ' : 'Agregar a Favoritas: ') + t.title">
                <svg class="ic stroke-current stroke-2" :class="!has(lists[0], t) && 'fill-transparent'" viewBox="0 0 24 24"><path :d="ic.heart" /></svg>
              </button>
              <button @click.stop="openMenu(t, $event)" class="ib" :aria-label="'Agregar a lista: ' + t.title">
                <svg class="ic" viewBox="0 0 24 24"><path :d="ic.plus" /></svg>
              </button>
              <button x-show="list && list.id !== 'fav'" @click.stop="toggleIn(list, t)" class="ib" :aria-label="'Quitar de esta lista: ' + t.title">
                <svg class="ic" viewBox="0 0 24 24"><path :d="ic.close" /></svg>
              </button>
              <span class="hidden w-12 text-right text-sm tabular-nums text-bruma sm:block" x-text="fmt(t.duration)"></span>
            </div>
          </div>
        </template>
        <button x-show="view === '' && page.tracks?.length > 3" @click="expanded = !expanded" :aria-expanded="expanded"
          class="mt-3 cursor-pointer rounded-full bg-white/10 px-4 py-2 text-sm font-semibold hover:bg-white/15"
          x-text="expanded ? 'Ver menos' : `Ver todas (${page.tracks?.length})`"></button>
      </section>

      <template x-for="rail in rails" :key="rail.kind">
        <section>
          <h2 class="mb-3 font-display text-lg font-medium" x-text="rail.label"></h2>
          <div class="grid grid-cols-[repeat(auto-fill,minmax(9rem,1fr))] gap-5">
            <template x-for="c in rail.items" :key="c.id">
              <a :href="`#/${rail.kind}/${c.id}`" class="group min-w-0">
                <img :src="c.cover" alt="" loading="lazy" class="aspect-square w-full object-cover group-hover:brightness-110"
                  :class="rail.kind === 'artist' ? 'rounded-full' : 'rounded-lg'">
                <p class="mt-2 truncate font-medium group-hover:underline" x-text="c.title"></p>
              </a>
            </template>
          </div>
        </section>
      </template>
    </div>
  </main>

  <!-- Reproductor -->
  <audio x-ref="audio" x-effect="$el.volume = volume" @play="playing = true" @pause="playing = false"
    @ended="step(1, true)" @timeupdate="time = $el.currentTime" @loadedmetadata="duration = $el.duration"
    @error="if (current) { failed = true; playing = false }"></audio>
  <footer x-show="current" x-cloak class="flex flex-wrap items-center gap-x-4 gap-y-1 bg-tinta/80 px-4 py-3 md:col-span-2 md:grid md:grid-cols-[1fr_2fr_1fr]">
    <div class="flex min-w-0 flex-1 items-center gap-3">
      <img :src="current?.cover" alt="" class="size-12 rounded">
      <div class="min-w-0">
        <p class="truncate font-medium" x-text="current?.title"></p>
        <a :href="`#/artist/${current?.artist_id}`" class="block truncate text-sm text-bruma hover:text-niebla hover:underline" x-text="failed ? 'No se pudo reproducir esta canción' : current?.artist"></a>
      </div>
    </div>
    <div class="flex flex-col items-center md:order-none">
      <div class="flex items-center gap-1">
        <button @click="shuffle = !shuffle" class="ib max-md:hidden" :class="shuffle && 'text-marea'" :aria-pressed="shuffle" aria-label="Aleatorio">
          <svg class="ic" viewBox="0 0 24 24"><path :d="ic.shuffle" /></svg>
        </button>
        <button @click="step(-1)" class="ib" aria-label="Anterior"><svg class="ic" viewBox="0 0 24 24"><path :d="ic.prev" /></svg></button>
        <button @click="toggle()" class="grid size-11 cursor-pointer place-items-center rounded-full bg-marea text-tinta hover:brightness-110" :aria-label="playing ? 'Pausar' : 'Reproducir'">
          <svg class="ic" viewBox="0 0 24 24"><path :d="playing ? ic.pause : ic.play" /></svg>
        </button>
        <button @click="step(1)" class="ib" aria-label="Siguiente"><svg class="ic" viewBox="0 0 24 24"><path :d="ic.next" /></svg></button>
        <button @click="repeat = { off: 'all', all: 'one', one: 'off' }[repeat]" class="ib max-md:hidden" :class="repeat !== 'off' && 'text-marea'"
          :aria-label="{ off: 'Repetir: no', all: 'Repetir: toda la cola', one: 'Repetir: esta canción' }[repeat]">
          <svg class="ic" viewBox="0 0 24 24"><path :d="repeat === 'one' ? ic.repeatOne : ic.repeat" /></svg>
        </button>
      </div>
    </div>
    <div class="order-last flex w-full items-center gap-2 text-xs tabular-nums text-bruma md:order-none md:col-start-2 md:row-start-2">
      <span x-text="fmt(time)"></span>
      <input type="range" min="0" :max="duration || 30" step="0.1" :value="time" @input="$refs.audio.currentTime = $event.target.value" aria-label="Posición" class="min-w-0 flex-1 accent-marea">
      <span x-text="fmt(duration)"></span>
    </div>
    <div class="hidden items-center justify-end gap-2 text-xs text-bruma md:col-start-3 md:row-span-2 md:row-start-1 md:flex">
      <span>Vista previa de 30 s</span>
      <svg class="ic" viewBox="0 0 24 24"><path :d="ic.volume" /></svg>
      <input type="range" min="0" max="1" step="0.01" x-model.number="volume" aria-label="Volumen" class="w-24 accent-marea">
    </div>
  </footer>

  <!-- Menú "agregar a lista" (uno solo para todas las filas) -->
  <div x-show="menu" x-cloak @click.outside="menu = null" :style="menu?.style"
    class="fixed z-20 max-h-72 w-56 overflow-y-auto rounded-lg bg-noche p-1 ring-1 ring-white/10">
    <template x-for="l in lists" :key="l.id">
      <button @click="toggleIn(l, menu.track)" class="flex w-full cursor-pointer items-center justify-between gap-2 rounded px-3 py-2 text-left hover:bg-white/10">
        <span class="truncate" x-text="l.name"></span>
        <svg x-show="menu && has(l, menu.track)" class="ic shrink-0 text-marea" viewBox="0 0 24 24"><path :d="ic.check" /></svg>
      </button>
    </template>
    <button @click="createList(menu.track)" class="flex w-full cursor-pointer items-center gap-2 rounded px-3 py-2 text-left text-marea hover:bg-white/10">
      <svg class="ic" viewBox="0 0 24 24"><path :d="ic.plus" /></svg>Crear lista
    </button>
  </div>

  <script>
    const ic = {
      home: 'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',
      heart: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z',
      list: 'M15 6H3v2h12zm0 4H3v2h12zM3 16h8v-2H3zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6z',
      plus: 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z',
      close: 'M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
      check: 'M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z',
      play: 'M8 5v14l11-7z',
      pause: 'M6 5h4v14H6zM14 5h4v14h-4z',
      prev: 'M6 6h2v12H6zm3.5 6 8.5 6V6z',
      next: 'M6 18l8.5-6L6 6zM16 6h2v12h-2z',
      shuffle: 'M10.59 9.17 5.41 4 4 5.41l5.17 5.17zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04z',
      repeat: 'M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z',
      repeatOne: 'M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2zm-4-2V9h-1l-2 1v1h1.5v4z',
      volume: 'M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z',
    };

    function app() {
      return {
        ic,
        lists: Alpine.$persist([{ id: 'fav', name: 'Favoritas', tracks: [] }]).as('onda-lists'),
        volume: Alpine.$persist(0.8).as('onda-volume'),
        view: '', listId: null, query: '', remote: {}, loading: false, error: '', confirming: false, menu: null, expanded: false,
        ticket: 0, // descarta respuestas viejas si el usuario sigue navegando
        queue: [], index: -1, playing: false, time: 0, duration: 0, shuffle: false, repeat: 'off', failed: false,
        auras: [],

        get list() { return this.lists.find(l => l.id === this.listId); },
        get current() { return this.queue[this.index]; },
        get page() {
          const l = this.list;
          if (!l) return this.remote;
          const n = l.tracks.length;
          return { title: l.name, subtitle: n === 1 ? '1 canción' : `${n} canciones`, cover: l.tracks[0]?.cover, tracks: l.tracks };
        },
        // En inicio se ven 3 canciones; la cola siempre usa todas
        get shownTracks() {
          return this.view === '' && !this.expanded ? this.page.tracks?.slice(0, 3) : this.page.tracks;
        },
        get rails() {
          return [['album', 'Álbumes', this.page.albums], ['artist', 'Artistas', this.page.artists]]
            .filter(([, , items]) => items?.length).map(([kind, label, items]) => ({ kind, label, items }));
        },

        async route() {
          const [view = '', param = ''] = location.hash.slice(2).split('/');
          const id = decodeURIComponent(param), ticket = ++this.ticket;
          Object.assign(this, { view, error: '', confirming: false, menu: null, expanded: false, listId: view === 'list' ? id : null });
          if (view !== 'search') this.query = '';
          else if (this.query.trim() !== id) this.query = id;
          this.$refs.main.scrollTop = 0;
          if (view === 'list') {
            this.loading = false;
            if (!this.list) location.hash = '#/';
            else if (!this.auras.length) this.setAura(this.page.cover);
            return;
          }
          this.loading = true;
          const url = { search: `/api/search?q=${param}`, artist: `/api/artist/${param}`, album: `/api/album/${param}` }[view] ?? '/api/home';
          try {
            const r = await fetch(url);
            if (!r.ok) throw r;
            const data = await r.json();
            if (ticket === this.ticket) {
              this.remote = this.shape(view, data, id);
              if (!this.auras.length) this.setAura(this.page.tracks[0]?.cover);
            }
          } catch {
            if (ticket === this.ticket) {
              this.remote = {};
              this.error = 'No se pudo cargar esta página. Revisa tu conexión e intenta de nuevo.';
            }
          }
          if (ticket === this.ticket) this.loading = false;
        },

        shape(view, data, id) {
          if (view === 'search') return { ...data, title: `Resultados para «${id}»` };
          if (view === 'artist') return { ...data, subtitle: `${data.fans.toLocaleString('es')} seguidores` };
          if (view === 'album') return { ...data, subtitle: data.artist };
          return data;
        },

        search() {
          const q = this.query.trim();
          location.hash = q ? `#/search/${encodeURIComponent(q)}` : '#/';
        },

        // Listas: se guardan solas en localStorage gracias a $persist
        createList(track) {
          const list = { id: Date.now().toString(36), name: `Lista ${this.lists.length}`, tracks: track ? [{ ...track }] : [] };
          this.lists.push(list);
          this.menu = null;
          if (!track) location.hash = `#/list/${list.id}`;
        },
        deleteList() {
          const id = this.listId;
          this.listId = null;
          this.lists = this.lists.filter(l => l.id !== id);
          location.hash = '#/';
        },
        has(list, t) { return list.tracks.some(x => x.id === t.id); },
        toggleIn(list, t) {
          list.tracks = this.has(list, t) ? list.tracks.filter(x => x.id !== t.id) : [...list.tracks, { ...t }];
        },
        openMenu(track, e) {
          const { left, top, bottom } = e.currentTarget.getBoundingClientRect();
          const y = top > innerHeight / 2 ? `bottom: ${innerHeight - top + 4}px` : `top: ${bottom + 4}px`;
          this.menu = { track, style: `left: ${Math.min(left, innerWidth - 240)}px; ${y}` };
        },

        // Reproductor
        isCurrent(t) { return this.current?.id === t.id; },
        clickTrack(i) {
          this.isCurrent(this.page.tracks[i]) ? this.toggle() : this.playFrom(this.page.tracks, i);
        },
        playFrom(tracks, i) {
          this.queue = tracks.map(t => ({ ...t }));
          this.play(i);
        },
        play(i) {
          const audio = this.$refs.audio;
          Object.assign(this, { index: i, failed: false, time: 0, duration: 0 });
          audio.src = `/api/preview/${this.current.id}`; // siempre una URL fresca
          audio.play().catch(() => { });
          this.setAura(this.current.cover);
        },
        toggle() {
          const audio = this.$refs.audio;
          audio.paused ? audio.play().catch(() => { }) : audio.pause();
        },
        step(dir, auto = false) {
          const audio = this.$refs.audio, n = this.queue.length;
          if ((auto && this.repeat === 'one') || (dir < 0 && audio.currentTime > 3)) {
            audio.currentTime = 0;
            return audio.play().catch(() => { });
          }
          if (this.shuffle && n > 1) {
            const offset = 1 + Math.floor(Math.random() * (n - 1));
            return this.play((this.index + offset) % n);
          }
          const next = this.index + dir;
          if (auto && next === n && this.repeat === 'off') return;
          this.play((next + n) % n);
        },
        setAura(cover) {
          if (cover && this.auras.at(-1) !== cover) this.auras = [...this.auras.slice(-1), cover];
        },
        fmt(s) {
          s = Math.floor(s || 0);
          return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        },
      };
    }
  </script>
</body>

</html>
